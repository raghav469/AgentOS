
services:
  db:
    image: pgvector/pgvector:pg16
    container_name: forge-db
    environment:
      POSTGRES_USER: forge
      POSTGRES_PASSWORD: forgepassword
      POSTGRES_DB: forgedb
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: always

  redis:
    image: redis:7-alpine
    container_name: forge-redis
    ports:
      - "6379:6379"
    restart: always

  backend:
    build: .
    container_name: forge-backend
    environment:
      DATABASE_URL: postgres://forge:forgepassword@db:5432/forgedb
      REDIS_URL: redis://redis:6379
      PORT: 3001
    ports:
      - "3001:3001"
    depends_on:
      - db
      - redis
    restart: always

  worker:
    build: .
    container_name: forge-worker
    command: ["tsx", "src/worker.ts"]
    environment:
      DATABASE_URL: postgres://forge:forgepassword@db:5432/forgedb
      REDIS_URL: redis://redis:6379
    depends_on:
      - db
      - redis
    restart: always

  frontend:
    build: ./frontend
    container_name: forge-frontend
    environment:
      API_URL: http://backend:3001
      NEXT_PUBLIC_API_URL: http://localhost:3001
    ports:
      - "3000:3000"
    depends_on:
      - backend
    restart: always

volumes:
  postgres_data:
